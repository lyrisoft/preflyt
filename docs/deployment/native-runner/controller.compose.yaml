# Dedicated preflight process. Job dispatch remains disabled pending P3 completion.
name: preflyt-native-docker-controller
services:
  controller:
    image: ${PREFLYT_NATIVE_CONTROLLER_IMAGE:?Set the reviewed native controller image digest}
    command: [node, dist/execution-controller.js]
    env_file: controller.env
    user: '1000:1000'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped
    ports: ['127.0.0.1:3010:3010']
    volumes:
      - ./docker-tls:/run/docker-tls:ro
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:3010/health/live",{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 30s
      timeout: 5s
      retries: 3
