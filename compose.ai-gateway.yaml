# Opt-in overlay: docker compose -f docker-compose.yaml -f compose.ai-gateway.yaml --profile ai-gateway up -d litellm
services:
  litellm:
    profiles: [ai-gateway]
    image: docker.litellm.ai/berriai/litellm:v1.98.0@sha256:20b5044b619055374061a6d5b7b08754cad75aeabbf82ddf4f69cc0cf80ddaf4
    command: [--config, /app/preflyt-config.yaml, --port, '4000']
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Set a gateway key}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      HOME: /tmp
      PYTHONDONTWRITEBYTECODE: '1'
    volumes:
      - ./docs/deployment/ai-gateway/config.yaml:/app/preflyt-config.yaml:ro
    ports: ['127.0.0.1:4000:4000']
    networks: [backend, egress]
    user: '65532:65532'
    read_only: true
    tmpfs: ['/tmp:size=128m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:4000/health/liveliness", timeout=3)']
      interval: 20s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
