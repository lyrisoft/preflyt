name: Prepare CI dependencies
description: Install the locked workspace using a cached pnpm download store.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24.4.1
    - name: Select pinned pnpm
      shell: bash
      run: npm install --global pnpm@10.26.2
    - name: Locate pnpm store
      id: store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-${{ runner.os }}-${{ runner.arch }}-10.26.2-${{ hashFiles('pnpm-lock.yaml') }}
    - name: Install locked dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --ignore-scripts
