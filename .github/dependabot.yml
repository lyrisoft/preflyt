version: 2
updates:
  # Temporarily paused to conserve build minutes. Restore the limits below
  # (5, 2 and 3) to resume version update PRs. Security PRs are controlled
  # separately in GitHub repository settings.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      tooling:
        dependency-type: development
  - package-ecosystem: npm
    directory: /docs/deployment/native-runner/duplication
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
