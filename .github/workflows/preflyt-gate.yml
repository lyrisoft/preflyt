name: Preflyt publication gate
on:
  workflow_run:
    workflows: [Verify implementation]
    types: [completed]
permissions:
  contents: read
  id-token: write
  actions: read
jobs:
  publication:
    name: Preflyt publication verified
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Identify development PR
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > /tmp/preflyt-source-run.json
          python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import json
          with open('/tmp/preflyt-source-run.json') as source:
              run = json.load(source)
          prs = run.get('pull_requests', [])
          if run.get('event') != 'pull_request' or not prs:
              raise SystemExit('Unable to verify the source PR; refusing to skip publication verification.')
          development = any(pr['base']['ref'] == 'development' for pr in prs)
          print('applicable=' + str(development).lower())
          PYTHON
      - name: Wait for verified Preflyt publication
        if: steps.scope.outputs.applicable == 'true'
        uses: lyrisoft/preflyt-action@d80243bae90cc85eaaca08a60e8efd15a413d35a # v1.0.0
        with:
          mode: gate
          api-url: ${{ vars.PREFLYT_API_URL }}
          source-run: ${{ github.event.workflow_run.id }}
          source-attempt: ${{ github.event.workflow_run.run_attempt }}
