name: Verify implementation
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: preflyt-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: preflyt
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: preflyt_ci_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U preflyt -d preflyt_ci_test" --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://preflyt:fixture-only@127.0.0.1:5432/preflyt_ci_test
      REDIS_URL: redis://127.0.0.1:6379/3
      REDIS_CACHE_PREFIX: preflyt-ci-${{ github.run_id }}-${{ github.run_attempt }}
      PREFLYT_DASHBOARD_REDIS_TEST: 'true'
      TEST_QUEUE_REDIS_URL: redis://127.0.0.1:6379/1
      NOTIFICATION_TEST_REDIS_URL: redis://127.0.0.1:6379/2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prepare CI reports
        run: mkdir -p .preflyt/results
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.4.1
      - name: Install locked dependencies
        run: |
          npm install --global pnpm@10.15.1
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Chromium
        run: pnpm --filter @preflyt/web exec playwright install --with-deps chromium
      - name: Generate client and build applications
        id: build
        run: node docs/deployment/ci-command-report.mjs build.required .preflyt/results/build.xml -- "$(command -v pnpm)" -r --filter @preflyt/api --filter @preflyt/web build
      - name: Enable offline attestation acceptance
        run: |
          gh_path="$(command -v gh)"
          echo "PREFLYT_TEST_GH_PATH=$gh_path" >> "$GITHUB_ENV"
      - name: API regression
        if: ${{ !cancelled() && steps.build.conclusion == 'success' }}
        run: pnpm --filter @preflyt/api test --reporter=default --reporter=junit --outputFile.junit=../../.preflyt/results/api-tests.xml
      - name: Browser regression
        if: ${{ !cancelled() && steps.build.conclusion == 'success' }}
        run: pnpm --filter @preflyt/web test --reporter=default --reporter=junit --outputFile.junit=../../.preflyt/results/web-tests.xml
      - name: Combine actual API and browser test results
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/merge-junit.py .preflyt/results/tests.xml .preflyt/results/api-tests.xml .preflyt/results/web-tests.xml
      - name: Preflyt development policy
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.base_ref == 'development' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: lyrisoft/preflyt-action@d80243bae90cc85eaaca08a60e8efd15a413d35a # v1.0.0
        with:
          api-url: ${{ vars.PREFLYT_API_URL }}
          checks: |
            {
              "build.required": {"report": ".preflyt/results/build.xml"},
              "tests.required": {"report": ".preflyt/results/tests.xml"}
            }
  images:
    name: Build ${{ matrix.image }}
    if: ${{ github.event_name == 'pull_request' }}
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: preflyt-api
            file: deploy/api.Dockerfile
            target: runtime
          - image: preflyt-api-migration
            file: deploy/api.Dockerfile
            target: migration
          - image: preflyt-native-controller
            file: deploy/api.Dockerfile
            target: native-docker-controller
          - image: preflyt-web
            file: deploy/web.Dockerfile
            target: runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  compose-smoke:
    uses: ./.github/workflows/compose-acceptance.yml
