name: Verify implementation
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: preflyt-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    runs-on: ubuntu-latest
    steps:
      - name: Verify branch target
        env:
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          case "$TARGET_BRANCH" in
            development|main) ;;
            *) echo 'PR verification supports only development and main.' >&2; exit 1 ;;
          esac
  development:
    needs: scope
    if: ${{ (github.base_ref || github.ref_name) == 'development' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      contents: read
    uses: ./.github/workflows/development-checks.yml
  fork_development:
    needs: scope
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'development' && github.event.pull_request.head.repo.full_name != github.repository }}
    permissions:
      contents: read
    uses: ./.github/workflows/main-regression.yml
  main:
    needs: scope
    if: ${{ (github.base_ref || github.ref_name) == 'main' }}
    uses: ./.github/workflows/main-regression.yml
