name: Build and publish production
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: preflyt-images-main-release
  cancel-in-progress: false
jobs:
  branch:
    name: Require main branch
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate manual publication target
        env:
          PUBLICATION_REF: ${{ github.ref }}
        run: test "$PUBLICATION_REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Plan installed release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/plan-release.mjs
  build:
    needs: branch
    name: Build ${{ matrix.group }} (${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        group: [api, web]
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.4.1
      - name: Ensure API build disk headroom
        if: matrix.group == 'api' && matrix.platform.arch == 'amd64'
        run: node scripts/ci/prepare-image-build.mjs
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build related targets together on native CPU
        env:
          ARCH: ${{ matrix.platform.arch }}
          BUILD_GROUP: ${{ matrix.group }}
          PREFLYT_BUILD_VERSION: ${{ needs.branch.outputs.version }}
        run: |
          node scripts/ci/publish-release.mjs build
  publish:
    name: Publish dual architecture manifests
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.4.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Preserve and verify complete release manifests
        run: node scripts/ci/publish-release.mjs manifest
  release:
    name: Create versioned main release
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [branch, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.4.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag built images and publish release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREFLYT_BUILD_VERSION: ${{ needs.branch.outputs.version }}
        run: node scripts/ci/create-release.mjs
