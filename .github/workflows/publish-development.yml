name: Build and publish development
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: preflyt-publish-development
  cancel-in-progress: false
jobs:
  branch:
    name: Require development branch
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Validate manual publication target
        env:
          PUBLICATION_REF: ${{ github.ref }}
        run: test "$PUBLICATION_REF" = refs/heads/development
  build:
    needs: branch
    name: Build ${{ matrix.group }} (${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        group: [api, web, strix]
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.4.1
      - name: Ensure scanner build disk headroom
        if: matrix.group != 'web' && matrix.platform.arch == 'amd64'
        run: node scripts/ci/prepare-image-build.mjs
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build related targets together on native CPU
        env:
          ARCH: ${{ matrix.platform.arch }}
          BUILD_GROUP: ${{ matrix.group }}
        run: |
          node scripts/ci/publish-release.mjs build
  publish:
    name: Publish dual architecture manifests
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.4.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Preserve and verify complete release manifests
        run: node scripts/ci/publish-release.mjs manifest
