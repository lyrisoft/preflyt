name: Development checks
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  source:
    name: Source checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-ci
      - name: Release automation tests
        run: |
          node --test scripts/ci/create-release.test.mjs scripts/ci/publish-release.test.mjs scripts/ci/change-scope.test.mjs scripts/ci/prepare-image-build.test.mjs scripts/ci/local-images.test.mjs scripts/ci/braces-depth.test.mjs scripts/deploy/*.test.mjs
          python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Select focused tests
        id: focused
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/change-scope.mjs plan
      - name: Generate API test client
        env:
          DATABASE_URL: postgresql://fixture:fixture@127.0.0.1:1/unused
        run: pnpm --filter @preflyt/api prisma:generate
      - name: API unit tests and coverage
        if: ${{ !cancelled() }}
        env:
          PREFLYT_COLLECT_COVERAGE: 'true'
        run: |
          echo "CI_COVERAGE_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          pnpm --filter @preflyt/api exec vitest run --exclude '**/*.integration.test.ts'
      - name: Prepare API coverage artifact
        if: ${{ success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci/export-coverage.py apps/api/coverage/lcov.info apps/api .preflyt/coverage-api
      - name: Upload API coverage from this execution
        if: ${{ success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preflyt-coverage-api-${{ github.run_id }}-${{ github.run_attempt }}
          path: .preflyt/coverage-api/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm --filter @preflyt/web lint
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-ci
      - name: Restore build cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ runner.arch }}-node24-v1-${{ github.event.pull_request.head.sha || github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ runner.arch }}-node24-v1-
      - name: Restore Chromium download
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Select focused tests
        id: focused
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/change-scope.mjs plan
      - name: Generate API test client
        env:
          DATABASE_URL: postgresql://fixture:fixture@127.0.0.1:1/unused
        run: pnpm --filter @preflyt/api prisma:generate
      - name: Type checks
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.base_ref != 'development' || github.event.pull_request.head.repo.full_name != github.repository) }}
        env:
          DATABASE_URL: postgresql://fixture:fixture@127.0.0.1:1/unused
        run: pnpm -r --filter @preflyt/api --filter @preflyt/web typecheck
      - name: Build validation
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.base_ref != 'development' || github.event.pull_request.head.repo.full_name != github.repository) }}
        env:
          DATABASE_URL: postgresql://fixture:fixture@127.0.0.1:1/unused
        run: pnpm -r --filter @preflyt/api --filter @preflyt/web build
      # Preflyt Action paused; manual checks run directly below.
      # - name: Mark current policy execution
      #   run: echo "CI_POLICY_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      # - name: Preflyt development policy
      #   id: policy
      #   if: ${{ !cancelled() && github.event_name == 'pull_request' && github.base_ref == 'development' && github.event.pull_request.head.repo.full_name == github.repository }}
      #   uses: lyrisoft/preflyt-action@72bd67f0e75e4409a5b3d37367ffb94073e9bf11 # same-run LCOV coverage
      #   env:
      #     DATABASE_URL: postgresql://fixture:fixture@127.0.0.1:1/unused
      #     PREFLYT_COLLECT_COVERAGE: 'true'
      #   with:
      #     coverage-reports: '[{"path":"apps/web/coverage/lcov.info","prefix":"apps/web"}]'
      #     coverage-artifact: preflyt-coverage-api-${{ github.run_id }}-${{ github.run_attempt }}
      #     api-url: ${{ vars.PREFLYT_API_URL }}
      # - name: Check current policy browser coverage
      #   id: browser
      #   if: ${{ !cancelled() && steps.focused.outputs.web == 'true' }}
      #   env:
      #     CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      #   run: python3 scripts/ci/policy-browser-coverage.py
      - name: Install Chromium for related browser tests
        if: ${{ !cancelled() && steps.focused.outputs.web == 'true' }}
        run: pnpm --filter @preflyt/web exec playwright install --with-deps chromium
      - name: Related browser tests
        if: ${{ !cancelled() && steps.focused.outputs.web == 'true' }}
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/change-scope.mjs web
