name: Contribution sign-off
on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number to verify
        required: true
        type: number
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: preflyt-dco-${{ inputs.pull_request }}
  cancel-in-progress: true
jobs:
  dco:
    name: DCO sign-off
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # No checkout: untrusted PR code is never run by this metadata-only job.
      - name: Verify every commit author certified their contribution
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull_request }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import re
          import urllib.request

          number = os.environ['PR_NUMBER']
          repository = os.environ['GITHUB_REPOSITORY']
          if not number.isdigit() or not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', repository):
              raise SystemExit('Invalid pull request identity')
          url = f"{os.environ['GITHUB_API_URL']}/repos/{repository}/pulls/{number}"
          request = urllib.request.Request(url, headers={
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              metadata = json.load(response)
          expected = int(metadata['commits'])
          head = metadata['head']['sha']
          if not 1 <= expected <= 250:
              raise SystemExit('Cannot verify this PR commit range; split PRs exceeding 250 commits')
          commits = []
          for page in range(1, 4):
              url = f"{os.environ['GITHUB_API_URL']}/repos/{repository}/pulls/{number}/commits?per_page=100&page={page}"
              request = urllib.request.Request(url, headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(request, timeout=30) as response:
                  batch = json.load(response)
              if not isinstance(batch, list):
                  raise SystemExit('Unexpected GitHub commit response')
              commits.extend(batch)
              if len(batch) < 100:
                  break
          if len(commits) != expected:
              raise SystemExit('Commit range changed or was truncated; retry against the current PR')
          if commits[-1].get('sha') != head:
              raise SystemExit('PR head changed; retry against the current revision')
          failed = []
          for item in commits:
              commit = item['commit']
              author = commit.get('author') or {}
              name = (author.get('name') or '').strip()
              email = (author.get('email') or '').strip().casefold()
              # Require a trailer block at the end of the message, not a quoted
              # sign-off inside the body. Additional conventional trailers may follow.
              lines = commit.get('message', '').rstrip().splitlines()
              trailers = []
              for line in reversed(lines):
                  if not re.fullmatch(r'[A-Za-z][A-Za-z0-9-]*: .+', line):
                      break
                  trailers.append(line)
              signed = False
              for line in trailers:
                  match = re.fullmatch(r'Signed-off-by: (.+) <([^<>\s]+@[^<>\s]+)>', line, re.IGNORECASE)
                  if match and match[1].strip() == name and match[2].casefold() == email:
                      signed = True
              if not name or not email or not signed:
                  sha = item.get('sha', '')
                  failed.append(sha[:12] if re.fullmatch(r'[a-f0-9]{40}', sha) else '(unknown commit)')
          if failed:
              print('Missing author-matching DCO sign-off: ' + ', '.join(failed))
              raise SystemExit('See CONTRIBUTING.md; add your own certification with git commit -s')
          print(f'DCO sign-off present for all {len(commits)} commits. This does not verify ownership or cryptographic signatures.')
          PYTHON
