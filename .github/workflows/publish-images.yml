name: Publish and verify release images
on:
  push:
    branches: [development, main]
permissions:
  contents: read
concurrency:
  group: preflyt-images-${{ github.ref_name == 'main' && 'main-release' || github.sha }}
  cancel-in-progress: false
jobs:
  inputs:
    name: Inspect deployable changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.scope.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.4.1
      - name: Decide whether image inputs changed
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.before }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci/change-scope.mjs images
  build:
    needs: inputs
    if: ${{ needs.inputs.outputs.publish == 'true' }}
    name: Build ${{ matrix.group }} (${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        group: [api, web]
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.4.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build related targets together on native CPU
        env:
          ARCH: ${{ matrix.platform.arch }}
          BUILD_GROUP: ${{ matrix.group }}
        run: |
          node --test scripts/deploy/*.test.mjs
          node scripts/ci/publish-release.mjs build
  publish:
    name: Publish dual architecture manifests
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.4.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Preserve and verify complete release manifests
        run: node scripts/ci/publish-release.mjs manifest
  accept-published:
    needs: publish
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/compose-acceptance.yml
    with:
      published_images: true

  release:
    name: Create versioned main release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [publish, accept-published]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.4.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag verified images and publish release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/create-release.mjs
