name: Documentation
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published stable release tag (blank selects the newest published release)
        required: false
        type: string
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: preflyt-docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check GitHub Pages configuration
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.event_name != 'pull_request'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.4.1
      - name: Install locked dependencies
        run: |
          npm install --global pnpm@10.26.2
          pnpm install --frozen-lockfile --ignore-scripts --filter @preflyt/docs...
      - name: Synchronize published release documentation
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          DOCS_RELEASE_TAG: ${{ inputs.release_tag }}
        run: node apps/docs/scripts/sync-releases.mjs
      - name: Type-check and build (fails on broken links and undocumented variables)
        env:
          DOCS_URL: https://docs.preflytlabs.com
          DOCS_BASE_URL: /
        run: |
          pnpm --filter @preflyt/docs typecheck
          pnpm --filter @preflyt/docs build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: apps/docs/build
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
