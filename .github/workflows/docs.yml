name: Documentation
on:
  pull_request:
    paths: ['apps/docs/**', '.env.example', '.github/workflows/docs.yml']
  push:
    branches: [main]
    paths: ['apps/docs/**', '.env.example', '.github/workflows/docs.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: preflyt-docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.4.1
      - name: Install locked dependencies
        run: |
          npm install --global pnpm@10.15.1
          pnpm install --frozen-lockfile --ignore-scripts --filter @preflyt/docs...
      - name: Type-check and build (fails on broken links and undocumented variables)
        run: |
          pnpm --filter @preflyt/docs typecheck
          pnpm --filter @preflyt/docs build
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.event_name != 'pull_request'
        with:
          path: apps/docs/build
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
