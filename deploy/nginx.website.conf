worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Query strings can contain OIDC codes or setup state; never log them.
    log_format safe '$remote_addr $request_method $uri $status';
    access_log /dev/stdout safe;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        error_page 404 =404 /404.html;
        # Security headers are repeated in child locations because any add_header resets inheritance.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 'ok';
        }

        location ~ /\. { return 404; }
        location /assets/ {
            try_files $uri =404;
            expires 1y;
        }
        location = / {
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
            try_files /index.html =404;
        }
        location = /index.html { return 308 /$is_args$args; }
        # The public canonical URL has no trailing slash, except the homepage.
        location ~ ^/(product(?:/(repository-health|standards-and-evidence|merge-protection))?|self-hosting|pricing)/(?:index\.html)?$ {
            return 308 /$1$is_args$args;
        }
        # Explicit public allowlist: keep route-specific HTML on direct loads.
        location ~ ^/(product(?:/(repository-health|standards-and-evidence|merge-protection))?|self-hosting|pricing)$ {
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
            try_files $uri/index.html =404;
        }


        location = /404.html {
            internal;
            add_header X-Robots-Tag "noindex, nofollow" always;
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
        }
        location / {
            try_files $uri =404;
        }
    }
}
